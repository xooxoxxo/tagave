<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/tagave-mark.png" />
    <link rel="apple-touch-icon" href="/tagave-mark.png" />
    <meta name="color-scheme" content="light dark" />
    <!-- Apply the saved theme before first paint so a dark choice never flashes light. Mirrors src/theme.ts. -->
    <script>try{var t=localStorage.getItem('tagave-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
    <title>tagave – Music Archive Catalog</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
