packages:
  - packages/*

# Never install a version published less than 5 days ago (minutes). Lives here
# so CI and Docker builds honour it, not only a developer's global config.
minimumReleaseAge: 7200

# Security exceptions to the age gate go in minimumReleaseAgeExclude: only the
# exact patched version, only while it is younger than 5 days, with a comment
# naming the advisory. Drop each entry once it ages past the gate.
