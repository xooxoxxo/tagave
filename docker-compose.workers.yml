# Docker Compose override for split topology
# Use this file when running workers on a different host than the API
#
# On the API host:
#   docker compose up -d  (normal startup)
#
# On the worker host:
#   docker compose -f docker-compose.yml -f docker-compose.workers.yml up -d
#
# Requires: Same .env file on both hosts

version: "3.8"

services:
  # Disable postgres on worker host
  postgres:
    deploy:
      replicas: 0

  # Disable app on worker host
  app:
    deploy:
      replicas: 0

  # File worker: scan operations
  worker-files:
    container_name: tagave-worker-files
    environment:
      # On worker host: connect to postgres on the primary host
      DATABASE_URL: postgres://${POSTGRES_USER:-liner}:${POSTGRES_PASSWORD}@${WORKER_DATABASE_HOST}:5432/${POSTGRES_DB:-liner}
    depends_on: {}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h ${WORKER_DATABASE_HOST} -U ${POSTGRES_USER:-liner}"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Identify worker: identification and enrichment
  worker-identify:
    container_name: tagave-worker-identify
    environment:
      # On worker host: connect to postgres on the primary host
      DATABASE_URL: postgres://${POSTGRES_USER:-liner}:${POSTGRES_PASSWORD}@${WORKER_DATABASE_HOST}:5432/${POSTGRES_DB:-liner}
    depends_on: {}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h ${WORKER_DATABASE_HOST} -U ${POSTGRES_USER:-liner}"]
      interval: 10s
      timeout: 3s
      retries: 5
