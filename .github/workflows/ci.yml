name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

# Least privilege by default. Only the publish job raises this.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: liner
          POSTGRES_DB: liner_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The worker and api suites are meaningless without a real database, and
      # migrating an empty one is also the stranger's exact first-boot path.
      DATABASE_URL: postgres://postgres:liner@127.0.0.1:5432/liner_test
      TEST_DATABASE_URL: postgres://postgres:liner@127.0.0.1:5432/liner_test

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build before typecheck: worker and api typecheck against the
      # declaration files emitted by shared, db and core.
      - run: pnpm -r build

      - run: pnpm -r typecheck

      - run: pnpm --filter @liner/db migrate

      - run: pnpm --filter @liner/core test
      - run: pnpm --filter @liner/worker test
      - run: pnpm --filter @liner/api test

      - name: Tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/check-version-tag.sh "${GITHUB_REF_NAME}"

      # The release gate that already exists and nothing runs: boots the real
      # compose stack, creates the first owner, validates a scan root through
      # the file worker, checks both workers report the app's git sha, and
      # exercises the backup subcommand.
      - name: Release smoke
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/smoke.sh

  build-amd64:
    needs: gates
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [app, worker]

    permissions:
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3.10.0

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build metadata
        id: meta
        run: |
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Image tags — ${{ matrix.image }}
        id: tags
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804  # v5.7.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/tagave-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push ${{ matrix.image }} (linux/amd64)
        id: build
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4  # v6.15.0
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/tagave-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.tags.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.meta.outputs.built_at }}
            LINER_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export digest
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          echo "Exporting digest for ${{ matrix.image }} on linux/amd64: $digest"
          echo "$digest" > "/tmp/digests/${{ matrix.image }}-linux-amd64.txt"

      - name: Upload digest artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: digest-${{ matrix.image }}-linux-amd64
          path: /tmp/digests/${{ matrix.image }}-linux-amd64.txt
          retention-days: 1

  build-arm64:
    needs: gates
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        image: [app, worker]

    permissions:
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3.10.0

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build metadata
        id: meta
        run: |
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Image tags — ${{ matrix.image }}
        id: tags
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804  # v5.7.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/tagave-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push ${{ matrix.image }} (linux/arm64)
        id: build
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4  # v6.15.0
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/tagave-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.tags.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.meta.outputs.built_at }}
            LINER_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export digest
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          echo "Exporting digest for ${{ matrix.image }} on linux/arm64: $digest"
          echo "$digest" > "/tmp/digests/${{ matrix.image }}-linux-arm64.txt"

      - name: Upload digest artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: digest-${{ matrix.image }}-linux-arm64
          path: /tmp/digests/${{ matrix.image }}-linux-arm64.txt
          retention-days: 1

  merge:
    needs: [gates, build-amd64, build-arm64]
    # build-arm64 is skipped on main (it is tag-only), and a job whose `needs`
    # contains a skipped job is itself skipped unless the condition carries a
    # status function. Without the leading !cancelled() the explicit tests below
    # are never even evaluated: the first main run built both amd64 images, then
    # skipped this job, so the images were pushed by digest with no tag on them
    # and no `edge` ever appeared. Green run, nothing usable.
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && needs.build-amd64.result == 'success'
      && (needs.build-arm64.result == 'success' || needs.build-arm64.result == 'skipped')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3.10.0

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: /tmp/digests
          pattern: digest-*

      - name: Build metadata
        id: meta
        run: |
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Image tags — app
        id: tags_app
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804  # v5.7.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/tagave-app
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Image tags — worker
        id: tags_worker
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804  # v5.7.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/tagave-worker
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Merge app manifests
        run: |
          set -euo pipefail
          refs=""
          # Collect available digests from artifacts
          if [ -f /tmp/digests/digest-app-linux-amd64/app-linux-amd64.txt ]; then
            amd64_digest=$(cat /tmp/digests/digest-app-linux-amd64/app-linux-amd64.txt)
            refs="${refs} ghcr.io/${{ github.repository_owner }}/tagave-app@${amd64_digest}"
          fi
          if [ -f /tmp/digests/digest-app-linux-arm64/app-linux-arm64.txt ]; then
            arm64_digest=$(cat /tmp/digests/digest-app-linux-arm64/app-linux-arm64.txt)
            refs="${refs} ghcr.io/${{ github.repository_owner }}/tagave-app@${arm64_digest}"
          fi

          if [ -z "$refs" ]; then
            echo "No digests found for app image"
            exit 1
          fi

          # Build tag arguments for docker buildx imagetools create
          tags="${{ steps.tags_app.outputs.tags }}"
          tag_args=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args="${tag_args} -t ${tag}"
          done <<< "$tags"

          # shellcheck disable=SC2086
          docker buildx imagetools create ${tag_args} ${refs}

      - name: Merge worker manifests
        run: |
          set -euo pipefail
          refs=""
          # Collect available digests from artifacts
          if [ -f /tmp/digests/digest-worker-linux-amd64/worker-linux-amd64.txt ]; then
            amd64_digest=$(cat /tmp/digests/digest-worker-linux-amd64/worker-linux-amd64.txt)
            refs="${refs} ghcr.io/${{ github.repository_owner }}/tagave-worker@${amd64_digest}"
          fi
          if [ -f /tmp/digests/digest-worker-linux-arm64/worker-linux-arm64.txt ]; then
            arm64_digest=$(cat /tmp/digests/digest-worker-linux-arm64/worker-linux-arm64.txt)
            refs="${refs} ghcr.io/${{ github.repository_owner }}/tagave-worker@${arm64_digest}"
          fi

          if [ -z "$refs" ]; then
            echo "No digests found for worker image"
            exit 1
          fi

          # Build tag arguments for docker buildx imagetools create
          tags="${{ steps.tags_worker.outputs.tags }}"
          tag_args=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args="${tag_args} -t ${tag}"
          done <<< "$tags"

          # shellcheck disable=SC2086
          docker buildx imagetools create ${tag_args} ${refs}

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=""
          case "${GITHUB_REF_NAME}" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            $PRERELEASE
