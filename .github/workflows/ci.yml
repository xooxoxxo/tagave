name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

# Least privilege by default. Only the publish job raises this.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: liner
          POSTGRES_DB: liner_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The worker and api suites are meaningless without a real database, and
      # migrating an empty one is also the stranger's exact first-boot path.
      DATABASE_URL: postgres://postgres:liner@127.0.0.1:5432/liner_test
      TEST_DATABASE_URL: postgres://postgres:liner@127.0.0.1:5432/liner_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build before typecheck: worker and api typecheck against the
      # declaration files emitted by shared, db and core.
      - run: pnpm -r build

      - run: pnpm -r typecheck

      - run: pnpm --filter @liner/db migrate

      - run: pnpm --filter @liner/core test
      - run: pnpm --filter @liner/worker test
      - run: pnpm --filter @liner/api test
      - run: pnpm --filter @liner/auth test

      - name: Tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/check-version-tag.sh "${GITHUB_REF_NAME}"

      # The release gate that already exists and nothing runs: boots the real
      # compose stack, creates the first owner, validates a scan root through
      # the file worker, checks both workers report the app's git sha, and
      # exercises the backup subcommand.
      - name: Release smoke
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/smoke.sh

  # The one-command installer: lint it, then run it unattended with --no-start
  # for every role against this checkout's deploy/ files and check what it
  # writes (compose accepts it, .env is mode 600, the split halves agree).
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: shellcheck
        run: shellcheck install-tagave.sh scripts/test-installer.sh scripts/check-templates.sh

      # Portainer, Dokploy, Coolify and Unraid templates in deploy/templates/
      - name: App templates
        run: ./scripts/check-templates.sh

      - name: Installer, every role
        run: ./scripts/test-installer.sh

  build-amd64:
    needs: gates
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [app, worker]

    permissions:
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build metadata
        id: meta
        run: |
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Image tags — ${{ matrix.image }}
        id: tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/tagave-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push ${{ matrix.image }} (linux/amd64)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/tagave-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.tags.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.meta.outputs.built_at }}
            LINER_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export digest
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          echo "Exporting digest for ${{ matrix.image }} on linux/amd64: $digest"
          echo "$digest" > "/tmp/digests/${{ matrix.image }}-linux-amd64.txt"

      - name: Upload digest artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: digest-${{ matrix.image }}-linux-amd64
          path: /tmp/digests/${{ matrix.image }}-linux-amd64.txt
          retention-days: 1

  build-arm64:
    needs: gates
    # main too, so `edge` is multi-arch: without it the installer's default
    # before the first release ran x86-64 emulated on every Apple Silicon Mac.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        image: [app, worker]

    permissions:
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build metadata
        id: meta
        run: |
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Image tags — ${{ matrix.image }}
        id: tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/tagave-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push ${{ matrix.image }} (linux/arm64)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/tagave-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.tags.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.meta.outputs.built_at }}
            LINER_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export digest
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          echo "Exporting digest for ${{ matrix.image }} on linux/arm64: $digest"
          echo "$digest" > "/tmp/digests/${{ matrix.image }}-linux-arm64.txt"

      - name: Upload digest artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: digest-${{ matrix.image }}-linux-arm64
          path: /tmp/digests/${{ matrix.image }}-linux-arm64.txt
          retention-days: 1

  merge:
    needs: [gates, build-amd64, build-arm64]
    # A job whose `needs` contains a skipped job is itself skipped unless the
    # condition carries a status function. Without the leading !cancelled() the
    # explicit tests below are never even evaluated: when build-arm64 was
    # tag-only, the first main run built both amd64 images, then skipped this
    # job, so the images were pushed by digest with no tag on them and no `edge`
    # ever appeared. Green run, nothing usable. Kept so a skipped arm64 build
    # (for example a disabled runner) still publishes amd64.
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && needs.build-amd64.result == 'success'
      && (needs.build-arm64.result == 'success' || needs.build-arm64.result == 'skipped')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*

      - name: Build metadata
        id: meta
        run: |
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Image tags — app
        id: tags_app
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/tagave-app
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Image tags — worker
        id: tags_worker
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/tagave-worker
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Merge app manifests
        run: |
          set -euo pipefail
          refs=""
          # Collect available digests from artifacts
          if [ -f /tmp/digests/digest-app-linux-amd64/app-linux-amd64.txt ]; then
            amd64_digest=$(cat /tmp/digests/digest-app-linux-amd64/app-linux-amd64.txt)
            refs="${refs} ghcr.io/${{ github.repository_owner }}/tagave-app@${amd64_digest}"
          fi
          if [ -f /tmp/digests/digest-app-linux-arm64/app-linux-arm64.txt ]; then
            arm64_digest=$(cat /tmp/digests/digest-app-linux-arm64/app-linux-arm64.txt)
            refs="${refs} ghcr.io/${{ github.repository_owner }}/tagave-app@${arm64_digest}"
          fi

          if [ -z "$refs" ]; then
            echo "No digests found for app image"
            exit 1
          fi

          # Build tag arguments for docker buildx imagetools create
          tags="${{ steps.tags_app.outputs.tags }}"
          tag_args=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args="${tag_args} -t ${tag}"
          done <<< "$tags"

          # shellcheck disable=SC2086
          docker buildx imagetools create ${tag_args} ${refs}

      - name: Merge worker manifests
        run: |
          set -euo pipefail
          refs=""
          # Collect available digests from artifacts
          if [ -f /tmp/digests/digest-worker-linux-amd64/worker-linux-amd64.txt ]; then
            amd64_digest=$(cat /tmp/digests/digest-worker-linux-amd64/worker-linux-amd64.txt)
            refs="${refs} ghcr.io/${{ github.repository_owner }}/tagave-worker@${amd64_digest}"
          fi
          if [ -f /tmp/digests/digest-worker-linux-arm64/worker-linux-arm64.txt ]; then
            arm64_digest=$(cat /tmp/digests/digest-worker-linux-arm64/worker-linux-arm64.txt)
            refs="${refs} ghcr.io/${{ github.repository_owner }}/tagave-worker@${arm64_digest}"
          fi

          if [ -z "$refs" ]; then
            echo "No digests found for worker image"
            exit 1
          fi

          # Build tag arguments for docker buildx imagetools create
          tags="${{ steps.tags_worker.outputs.tags }}"
          tag_args=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args="${tag_args} -t ${tag}"
          done <<< "$tags"

          # shellcheck disable=SC2086
          docker buildx imagetools create ${tag_args} ${refs}

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=""
          case "${GITHUB_REF_NAME}" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            $PRERELEASE
