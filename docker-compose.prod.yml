# Source build (scripts/deploy.sh). Superseded by the standard install
# (install-tagave.sh, deploy/compose.yml) and the in-app updater.
#
# The database names and password come from .env and have no defaults: a
# database this file created before 0.9 has user and database "liner" (and,
# if .env never set one, the password "liner"); a new one can use "tagave".
# Settings this file read as LINER_* before 0.9 are TAGAVE_* now; the old
# names in .env still work until 0.10.

# Container logs: json-file with no cap grew without limit (103k app lines in
# 8 days, audit 2026-10-10). 3 × 10 MB per container is weeks of history.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    # Sized for a ~6 GB RAM host shared with other containers;
    # database ~2.3 GB). Defaults (128 MB buffers, 4 MB work_mem) gave a 90 %
    # cache hit ratio and 1 GB of temp-file spills (audit 2026-10-10).
    #   shared_buffers 1GB         ~1/6 of RAM: the hot tables stay resident
    #   effective_cache_size 3GB   planner hint (buffers + OS page cache); allocates nothing
    #   work_mem 16MB              per sort/hash node; 16 MB × a few nodes × ~10 busy connections stays < 1 GB
    #   maintenance_work_mem 256MB vacuum and index builds
    #   random_page_cost 1.1       SSD-backed disk: index scans are not 4× a sequential read
    #   jit off                    JIT compile time (~100 ms) exceeded the run time of the queries it fired on
    #   pg_stat_statements         top-query ranking; run `create extension if not exists pg_stat_statements;` once
    #   log_min_duration_statement 500 ms: slow queries land in the log
    # Change a value: edit here, then `docker compose -f docker-compose.prod.yml up -d postgres` (a restart).
    command: >-
      postgres
      -c max_connections=300
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c jit=off
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.max=5000
      -c log_min_duration_statement=500
      -c log_temp_files=10MB
      -c log_autovacuum_min_duration=10s
    # parallel queries allocate dynamic shared memory in /dev/shm; Docker's
    # 64 MB default is too small once work_mem and buffers grow
    shm_size: 512mb
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILT_AT: ${BUILT_AT:-unknown}
        # empty: the image reads the version from its root package.json
        TAGAVE_BUILD_VERSION: ${TAGAVE_BUILD_VERSION:-}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      APP_SECRET: ${APP_SECRET:?set in .env}
      CACHE_DIR: /cache
      ALLOW_INSECURE_HTTP: "true"
      # Required: the address you open tagave at (https://music.example.com).
      # Sign-in trusts this origin and passkeys are bound to its host name.
      PUBLIC_URL: ${PUBLIC_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # true when a reverse proxy sets X-Forwarded-For (sign-in rate limits per client)
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Music Connections: public https hosts another music app may link from (docs/operations.md)
      MC_TRUSTED_PUBLIC_HOSTS: ${MC_TRUSTED_PUBLIC_HOSTS:-}
      NODE_ENV: production
      # Nightly, manual and pre-update database backups (Settings › Backups).
      # Before every database update the app writes a checked pg_dump here and
      # refuses to update when it fails (TAGAVE_SKIP_PREMIGRATE_BACKUP=1 overrides).
      BACKUP_DIR: /backups
      TAGAVE_PREMIGRATE_BACKUP_KEEP: ${TAGAVE_PREMIGRATE_BACKUP_KEEP:-${LINER_PREMIGRATE_BACKUP_KEEP:-}}
      TAGAVE_SKIP_PREMIGRATE_BACKUP: ${TAGAVE_SKIP_PREMIGRATE_BACKUP:-${LINER_SKIP_PREMIGRATE_BACKUP:-}}
      TAGAVE_ALLOW_SCHEMA_SKEW: ${TAGAVE_ALLOW_SCHEMA_SKEW:-${LINER_ALLOW_SCHEMA_SKEW:-}}
      TZ: ${TZ:-UTC}
      # Settings > Updates shows the source-build update steps first
      TAGAVE_INSTALL_METHOD: source
      TAGAVE_UPDATE_FEED: ${TAGAVE_UPDATE_FEED:-}
      # The bundled player (profile "player" below): set all three in .env
      # with TAGAVE_PLAYER_URL=http://player:4533 and TAGAVE_PLAYER_USER=admin.
      # Empty: no bundled player; Settings > Playback can point at your own.
      TAGAVE_PLAYER_URL: ${TAGAVE_PLAYER_URL:-}
      TAGAVE_PLAYER_USER: ${TAGAVE_PLAYER_USER:-}
      TAGAVE_PLAYER_PASSWORD: ${TAGAVE_PLAYER_PASSWORD:-}
      # Optional Last.fm API key + shared secret for scrobbling (Settings >
      # Playback > Scrobbling can store them instead).
      TAGAVE_LASTFM_API_KEY: ${TAGAVE_LASTFM_API_KEY:-}
      TAGAVE_LASTFM_SECRET: ${TAGAVE_LASTFM_SECRET:-}
    volumes:
      - cache:/cache
      # A volume of its own, or a host folder when TAGAVE_BACKUP_DIR is set.
      - ${TAGAVE_BACKUP_DIR:-backups}:/backups
    ports:
      - "${TAGAVE_PORT:-${LINER_PORT:-3100}}:3000"
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # healthy = migrations done; the workers wait for it
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 600s
      retries: 5

  # Workers: both run behind the "workers" profile. Start with
  # `docker compose --profile workers up -d`. The file worker owns
  # everything that touches the music mount; the identify worker
  # owns everything that spends provider budget (MusicBrainz, Discogs, etc.).
  worker-files:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILT_AT: ${BUILT_AT:-unknown}
        # empty: the image reads the version from its root package.json
        TAGAVE_BUILD_VERSION: ${TAGAVE_BUILD_VERSION:-}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      APP_SECRET: ${APP_SECRET:?set in .env}
      CACHE_DIR: /cache
      TAGAVE_QUEUES: scan.root,scan.dir,scan.sweep,scan.parse,cluster.dir,cluster.repairDiscs,art.fetch,art.sweep,gaps.recompute,queue.autoaccept,facets.refresh,fingerprint.album,fingerprint.sweep,tags.preview,tags.apply,tags.revert
      TAGAVE_LIBRARY_ID: ${TAGAVE_LIBRARY_ID:-${LINER_LIBRARY_ID:-}}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TAGAVE_ALLOW_SCHEMA_SKEW: ${TAGAVE_ALLOW_SCHEMA_SKEW:-${LINER_ALLOW_SCHEMA_SKEW:-}}
    volumes:
      - cache:/cache
      # read-only until M2 tag writing is switched on for this root
      - ${MUSIC_DIR:-/mnt/music}:/mnt/music:ro
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy

  worker-identify:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILT_AT: ${BUILT_AT:-unknown}
        # empty: the image reads the version from its root package.json
        TAGAVE_BUILD_VERSION: ${TAGAVE_BUILD_VERSION:-}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      APP_SECRET: ${APP_SECRET:?set in .env}
      CACHE_DIR: /cache
      TAGAVE_QUEUES: identify.album,identify.acoustid,identify.sweep,enrich.release,enrich.sweep,reviews.fetch,artists.resolve,artists.enrich,artists.refresh,artist.refresh,tracks.link,acoustid.lookup
      TAGAVE_LIBRARY_ID: ${TAGAVE_LIBRARY_ID:-${LINER_LIBRARY_ID:-}}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TAGAVE_ALLOW_SCHEMA_SKEW: ${TAGAVE_ALLOW_SCHEMA_SKEW:-${LINER_ALLOW_SCHEMA_SKEW:-}}
    volumes:
      - cache:/cache
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy

  # Optional player: an unmodified Navidrome, the same service as in
  # deploy/compose.yml (its comments explain each setting and the version
  # pin). Start with `docker compose --profile player up -d` after setting
  # TAGAVE_PLAYER_PASSWORD and TAGAVE_PLAYER_ENCRYPTION_KEY in .env (each
  # `openssl rand -hex 32`); it refuses to start without them. The music is
  # always read-only here; the database stays on a local volume (SQLite).
  player:
    profiles: ["player"]
    image: ${TAGAVE_PLAYER_IMAGE:-deluan/navidrome:0.64.0}
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$ND_DEVAUTOCREATEADMINPASSWORD" ] || [ -z "$$ND_PASSWORDENCRYPTIONKEY" ]; then
          echo "tagave: TAGAVE_PLAYER_PASSWORD or TAGAVE_PLAYER_ENCRYPTION_KEY is missing from .env, so the player does not start." >&2
          exit 1
        fi
        exec /app/navidrome
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data/navidrome
      ND_CACHEFOLDER: /data/cache
      ND_CONFIGFILE: /data/navidrome/navidrome.toml
      ND_SCANNER_WATCHERWAIT: "0"
      ND_SCANNER_SCHEDULE: "@every 24h"
      ND_ENABLESHARING: "false"
      ND_ENABLEINSIGHTSCOLLECTOR: "false"
      ND_JELLYFIN_ENABLED: "false"
      ND_DEEZER_ENABLED: "false"
      # tagave scrobbles for each person; Navidrome's own scrobblers stay off
      ND_LASTFM_ENABLED: "false"
      ND_LISTENBRAINZ_ENABLED: "false"
      ND_SUBSONIC_DEFAULTREPORTREALPATH: "true"
      ND_DEVAUTOCREATEADMINPASSWORD: ${TAGAVE_PLAYER_PASSWORD:-}
      ND_PASSWORDENCRYPTIONKEY: ${TAGAVE_PLAYER_ENCRYPTION_KEY:-}
      ND_LOGLEVEL: info
      TZ: ${TZ:-UTC}
    volumes:
      - player-data:/data
      - ${MUSIC_DIR:-/mnt/music}:/music:ro
    ports:
      - "${TAGAVE_PLAYER_PORT:-4533}:4533"
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:4533/ping"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  pgdata:
  cache:
  backups:
  player-data:
