services:
  postgres:
    image: postgres:16
    command: postgres -c max_connections=300
    environment:
      POSTGRES_USER: liner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-liner}
      POSTGRES_DB: liner
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liner"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILT_AT: ${BUILT_AT:-unknown}
        # empty: the image reads the version from its root package.json
        LINER_VERSION: ${LINER_VERSION:-}
    environment:
      DATABASE_URL: postgres://liner:${POSTGRES_PASSWORD:-liner}@postgres:5432/liner
      APP_SECRET: ${APP_SECRET:?set in .env}
      CACHE_DIR: /cache
      ALLOW_INSECURE_HTTP: "true"
      NODE_ENV: production
      # Nightly, manual and pre-update database backups (Settings › Backups).
      # Before every database update the app writes a checked pg_dump here and
      # refuses to update when it fails (LINER_SKIP_PREMIGRATE_BACKUP=1 overrides).
      BACKUP_DIR: /backups
      LINER_BACKUP_DIR: /backups
      LINER_PREMIGRATE_BACKUP_KEEP: ${LINER_PREMIGRATE_BACKUP_KEEP:-5}
      LINER_SKIP_PREMIGRATE_BACKUP: ${LINER_SKIP_PREMIGRATE_BACKUP:-}
      LINER_ALLOW_SCHEMA_SKEW: ${LINER_ALLOW_SCHEMA_SKEW:-}
      TZ: ${TZ:-UTC}
      # Settings > Updates shows the source-build update steps first
      TAGAVE_INSTALL_METHOD: source
      TAGAVE_UPDATE_FEED: ${TAGAVE_UPDATE_FEED:-}
    volumes:
      - cache:/cache
      # A volume of its own, or a host folder when TAGAVE_BACKUP_DIR is set.
      - ${TAGAVE_BACKUP_DIR:-backups}:/backups
    ports:
      - "${LINER_PORT:-3100}:3000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # healthy = migrations done; the workers wait for it
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 600s
      retries: 5

  # Workers: both run behind the "workers" profile. Start with
  # `docker compose --profile workers up -d`. The file worker owns
  # everything that touches the music mount; the identify worker
  # owns everything that spends provider budget (MusicBrainz, Discogs, etc.).
  worker-files:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILT_AT: ${BUILT_AT:-unknown}
        # empty: the image reads the version from its root package.json
        LINER_VERSION: ${LINER_VERSION:-}
    environment:
      DATABASE_URL: postgres://liner:${POSTGRES_PASSWORD:-liner}@postgres:5432/liner
      APP_SECRET: ${APP_SECRET:?set in .env}
      CACHE_DIR: /cache
      LINER_QUEUES: scan.root,scan.dir,scan.sweep,scan.parse,cluster.dir,cluster.repairDiscs,art.fetch,art.sweep,gaps.recompute,queue.autoaccept,facets.refresh,fingerprint.album,fingerprint.sweep,tags.preview,tags.apply,tags.revert
      LINER_LIBRARY_ID: ${LINER_LIBRARY_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LINER_ALLOW_SCHEMA_SKEW: ${LINER_ALLOW_SCHEMA_SKEW:-}
    volumes:
      - cache:/cache
      # read-only until M2 tag writing is switched on for this root
      - ${MUSIC_DIR:-/mnt/music}:/mnt/music:ro
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy

  worker-identify:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILT_AT: ${BUILT_AT:-unknown}
        # empty: the image reads the version from its root package.json
        LINER_VERSION: ${LINER_VERSION:-}
    environment:
      DATABASE_URL: postgres://liner:${POSTGRES_PASSWORD:-liner}@postgres:5432/liner
      APP_SECRET: ${APP_SECRET:?set in .env}
      CACHE_DIR: /cache
      LINER_QUEUES: identify.album,identify.acoustid,identify.sweep,enrich.release,enrich.sweep,reviews.fetch,artists.resolve,artists.enrich,artists.refresh,artist.refresh,tracks.link,acoustid.lookup
      LINER_LIBRARY_ID: ${LINER_LIBRARY_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LINER_ALLOW_SCHEMA_SKEW: ${LINER_ALLOW_SCHEMA_SKEW:-}
    volumes:
      - cache:/cache
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy

volumes:
  pgdata:
  cache:
  backups:
