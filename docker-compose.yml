services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: liner
      POSTGRES_PASSWORD: liner
      POSTGRES_DB: liner
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: postgres -c max_connections=300
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liner"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    environment:
      DATABASE_URL: postgres://liner:liner@postgres:5432/liner
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      CACHE_DIR: /cache
      ALLOW_INSECURE_HTTP: "true"
      LINER_BACKUP_DIR: /backups
    volumes:
      - cache:/cache
      - backups:/backups
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 600s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        BUILT_AT: ${BUILT_AT:-unknown}
    environment:
      DATABASE_URL: postgres://liner:liner@postgres:5432/liner
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      CACHE_DIR: /cache
    volumes:
      - cache:/cache
      # music mounts are declared here and registered as scan roots in the UI
      # - /path/to/music:/music:ro
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy

volumes:
  pgdata:
  cache:
  backups:
