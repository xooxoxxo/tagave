version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: tagave-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-liner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-liner}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    command: postgres -c max_connections=300
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-liner}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - tagave

  app:
    image: ghcr.io/xooxoxxo/tagave-app:latest
    container_name: tagave-app
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILT_AT: ${BUILT_AT:-unknown}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-liner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-liner}
      APP_SECRET: ${APP_SECRET}
      CACHE_DIR: ${CACHE_DIR:-/cache}
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-true}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3100}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      HOSTNAME: ${HOSTNAME:-tagave.local}
      TZ: ${TIMEZONE:-UTC}
    volumes:
      - cache:/cache
    ports:
      - "${APP_PORT:-3100}:3000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tagave
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/_health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # File worker: handles scan operations (scan.root, scan.dir, etc.)
  worker-files:
    image: ghcr.io/xooxoxxo/tagave-worker:latest
    container_name: tagave-worker-files
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILT_AT: ${BUILT_AT:-unknown}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-liner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-liner}
      APP_SECRET: ${APP_SECRET}
      CACHE_DIR: ${CACHE_DIR:-/cache}
      LINER_QUEUES: scan.root,scan.dir,scan.sweep,scan.parse,cluster.dir,art.fetch,art.sweep,gaps.recompute,queue.autoaccept,facets.refresh,fingerprint.album,fingerprint.sweep
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HOSTNAME: ${HOSTNAME:-tagave.local}
      TZ: ${TIMEZONE:-UTC}
    volumes:
      - cache:/cache
      - ${MUSIC_DIR:-/mnt/music}:/mnt/music:ro
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tagave

  # Identify worker: handles identification and enrichment (identify.album, identify.acoustid, etc.)
  worker-identify:
    image: ghcr.io/xooxoxxo/tagave-worker:latest
    container_name: tagave-worker-identify
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILT_AT: ${BUILT_AT:-unknown}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-liner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-liner}
      APP_SECRET: ${APP_SECRET}
      CACHE_DIR: ${CACHE_DIR:-/cache}
      LINER_QUEUES: identify.album,identify.acoustid,identify.sweep,enrich.release,enrich.sweep,reviews.fetch,artists.resolve,artists.enrich,acoustid.lookup
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HOSTNAME: ${HOSTNAME:-tagave.local}
      TZ: ${TIMEZONE:-UTC}
    volumes:
      - cache:/cache
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tagave

volumes:
  pgdata:
    driver: local
  cache:
    driver: local

networks:
  tagave:
    driver: bridge
