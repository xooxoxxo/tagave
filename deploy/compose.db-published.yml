# tagave split install: publish Postgres so a file worker on another computer
# can reach it. Only the computer that runs the database uses this file.
#
# Postgres listens on DB_BIND, one address of this computer (the installer
# uses the advertise address), with the generated password from .env. On
# Linux, Docker publishes ports past ufw and firewalld, so a firewall rule
# does not limit who reaches it: the bind address does. docs/install.md
# ("The database link") covers DOCKER-USER rules and VPN links.

services:
  postgres:
    ports:
      - "${DB_BIND:?DB_BIND is missing from .env: the address Postgres listens on}:${DB_PORT:-5432}:5432"
