# tagave: compose file for installs from the published images.
#
# install-tagave.sh copies this file into the install directory and writes a
# .env next to it that picks which services run on this computer (through
# COMPOSE_PROFILES), so plain `docker compose ps|logs|pull|up -d` work there
# without extra flags.
#
#   profile "app"    database, web app and the identify worker
#   profile "files"  the file worker, which reads your music folder
#   profile "updater"  optional: the in-app updater (Settings > Updates). It
#                    holds the Docker socket, so it is off unless you add it;
#                    see docs/security.md before you do.
#   profile "player" optional: a bundled Navidrome that plays your albums in
#                    tagave and serves phone apps. Single-computer installs
#                    only for now; see docs/install.md.
#
# One computer runs both profiles. In a split install the computer with the
# database runs "app" (plus compose.db-published.yml, so the file worker can
# reach Postgres), and the computer that can see the music runs "files" with
# DB_HOST pointing at the first one.
#
# Building from source instead? Use docker-compose.prod.yml at the repo root.
#
# Images are pinned by digest: the in-app updater (and the installer, when it
# can check the release's signature) writes TAGAVE_DIGEST_* to .env from the
# release's signed manifest, and each image below becomes
# name:tag@sha256:<digest>, exactly what the tagave project published for
# this computer's architecture. Without them the tags are used. Optional
# modules that are not in this file live in modules/<id>.yml, which the
# updater writes and lists in COMPOSE_FILE.

name: ${COMPOSE_PROJECT_NAME:-tagave}

x-worker-env: &worker-env
  DATABASE_URL: postgres://${POSTGRES_USER:-tagave}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing from .env}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${POSTGRES_DB:-tagave}
  APP_SECRET: ${APP_SECRET:?APP_SECRET is missing from .env}
  CACHE_DIR: /cache
  # Empty: the nightly gap and collection jobs run for every library.
  # (LINER_LIBRARY_ID is its name before 0.9, read until 0.10.)
  TAGAVE_LIBRARY_ID: ${TAGAVE_LIBRARY_ID:-${LINER_LIBRARY_ID:-}}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TZ: ${TZ:-UTC}
  # A worker waits while the app has not applied the database updates it
  # needs, and stops if a newer app has updated the database.
  TAGAVE_ALLOW_SCHEMA_SKEW: ${TAGAVE_ALLOW_SCHEMA_SKEW:-}

# Labels for an optional update watcher. They do nothing unless you run one.
# Diun (notify only) watches the repository for new release tags; What's Up
# Docker can notify too. Update with install-tagave.sh update rather than
# letting a watcher replace the containers: it backs up the database first and
# restarts the app before the workers. See docs/operations.md.
x-watch-labels: &watch-labels
  diun.enable: "true"
  diun.watch_repo: "true"
  diun.include_tags: "^\\d+\\.\\d+\\.\\d+$$"
  diun.sort_tags: "semver"
  diun.max_tags: "5"
  wud.watch: "true"
  wud.tag.include: "^\\d+\\.\\d+\\.\\d+$$"

# Container logs: capped at 3 × 10 MB per container (json-file has no cap by default).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    profiles: ["app"]
    image: postgres:16${TAGAVE_DIGEST_POSTGRES:+@${TAGAVE_DIGEST_POSTGRES}}
    command: postgres -c max_connections=300
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tagave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing from .env}
      POSTGRES_DB: ${POSTGRES_DB:-tagave}
      TZ: ${TZ:-UTC}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    profiles: ["app"]
    image: ${TAGAVE_REGISTRY:-ghcr.io/xooxoxxo}/tagave-app:${TAGAVE_VERSION:?TAGAVE_VERSION is missing from .env}${TAGAVE_DIGEST_APP:+@${TAGAVE_DIGEST_APP}}
    labels: *watch-labels
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-tagave}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing from .env}@postgres:5432/${POSTGRES_DB:-tagave}
      APP_SECRET: ${APP_SECRET:?APP_SECRET is missing from .env}
      CACHE_DIR: /cache
      # true while the app is reached over plain http; set false once it sits
      # behind an https reverse proxy so session cookies get the secure flag.
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-true}
      # Required: the address you open tagave at, e.g. https://music.example.com.
      # Sign-in trusts this origin; passkeys are bound to its host name for good.
      PUBLIC_URL: ${PUBLIC_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-UTC}
      # Nightly, manual and pre-update database backups (Settings › Backups).
      # Before it applies a database update, the app writes a checked pg_dump
      # here and refuses to update if that fails. It keeps the newest
      # TAGAVE_PREMIGRATE_BACKUP_KEEP of them. Set TAGAVE_SKIP_PREMIGRATE_BACKUP=1
      # only to update without a backup on purpose.
      BACKUP_DIR: /backups
      TAGAVE_PREMIGRATE_BACKUP_KEEP: ${TAGAVE_PREMIGRATE_BACKUP_KEEP:-5}
      TAGAVE_SKIP_PREMIGRATE_BACKUP: ${TAGAVE_SKIP_PREMIGRATE_BACKUP:-}
      TAGAVE_ALLOW_SCHEMA_SKEW: ${TAGAVE_ALLOW_SCHEMA_SKEW:-}
      # Settings > Updates shows the update command for the way tagave was
      # installed: the installer writes TAGAVE_ROLE, the platform templates set
      # TAGAVE_INSTALL_METHOD. TAGAVE_UPDATE_FEED=off turns update checks off
      # for the whole server (a URL replaces the official release feed).
      TAGAVE_INSTALL_METHOD: ${TAGAVE_INSTALL_METHOD:-}
      TAGAVE_ROLE: ${TAGAVE_ROLE:-}
      TAGAVE_UPDATE_FEED: ${TAGAVE_UPDATE_FEED:-}
      # Where a release's signed manifest is downloaded from (empty: the
      # release on GitHub); the updater checks its signature either way.
      TAGAVE_RELEASE_ASSETS_URL: ${TAGAVE_RELEASE_ASSETS_URL:-}
      # Set (by install-tagave.sh --with-updater or enable-updater) when the
      # "updater" profile runs: Settings > Updates then offers the update
      # button. Empty: the page shows the command to run instead.
      TAGAVE_UPDATER_URL: ${TAGAVE_UPDATER_URL:-}
      # Set (by install-tagave.sh --with-player or enable-player) when the
      # "player" profile runs: the app plays albums through the bundled
      # Navidrome at this address with this account. Empty: no bundled player;
      # Settings > Playback can still point at a server of your own. The
      # workers never get these.
      TAGAVE_PLAYER_URL: ${TAGAVE_PLAYER_URL:-}
      TAGAVE_PLAYER_USER: ${TAGAVE_PLAYER_USER:-}
      TAGAVE_PLAYER_PASSWORD: ${TAGAVE_PLAYER_PASSWORD:-}
    networks:
      - default
      - updater
    volumes:
      - cache:/cache
      # A volume of its own by default; set TAGAVE_BACKUP_DIR in .env to a
      # folder on this computer (or a NAS mount) to keep the backups outside
      # Docker, where they are easier to copy somewhere else.
      - ${TAGAVE_BACKUP_DIR:-backups}:/backups
    ports:
      - "${TAGAVE_PORT:-3100}:3000"
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has node but no curl. /api/v1/health answers 503 only when
      # the database or the migration ledger is broken.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      # Long enough for the backup and migrations an update runs before the
      # app listens; a normal start turns healthy at the first passing check.
      start_period: 600s
      retries: 5

  # MusicBrainz and Discogs lookups, enrichment, reviews, artist refreshes and
  # track linking. Needs the internet, never your files, so it stays next to
  # the database.
  worker-identify:
    profiles: ["app"]
    image: ${TAGAVE_REGISTRY:-ghcr.io/xooxoxxo}/tagave-worker:${TAGAVE_VERSION:?TAGAVE_VERSION is missing from .env}${TAGAVE_DIGEST_WORKER:+@${TAGAVE_DIGEST_WORKER}}
    labels: *watch-labels
    environment:
      <<: *worker-env
      DATABASE_URL: postgres://${POSTGRES_USER:-tagave}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing from .env}@postgres:5432/${POSTGRES_DB:-tagave}
      TAGAVE_QUEUES: identify.album,identify.acoustid,identify.sweep,enrich.release,enrich.sweep,reviews.fetch,artists.resolve,artists.enrich,artists.refresh,artist.refresh,tracks.link,acoustid.lookup
    volumes:
      - cache:/cache
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
      # healthy = the app has finished updating the database
      app:
        condition: service_healthy

  # Scanning, clustering, cover art, fingerprints, tag plans: everything that
  # touches the music folder. Register the scan
  # root as /mnt/music in the app.
  #
  # Between them the two workers must list every queue the worker knows, or
  # jobs on the missing ones wait forever; packages/worker/src/deployQueues.test.ts
  # checks that.
  worker-files:
    profiles: ["files"]
    image: ${TAGAVE_REGISTRY:-ghcr.io/xooxoxxo}/tagave-worker:${TAGAVE_VERSION:?TAGAVE_VERSION is missing from .env}${TAGAVE_DIGEST_WORKER:+@${TAGAVE_DIGEST_WORKER}}
    labels: *watch-labels
    environment:
      <<: *worker-env
      TAGAVE_QUEUES: scan.root,scan.dir,scan.sweep,scan.parse,cluster.dir,cluster.repairDiscs,art.fetch,art.sweep,gaps.recompute,queue.autoaccept,facets.refresh,fingerprint.album,fingerprint.sweep,tags.preview,tags.apply,tags.revert
    volumes:
      - cache:/cache
      # Read-only unless TAGAVE_MUSIC_MODE=rw (install-tagave.sh
      # --music-writable): previews only read; applying a tag plan writes, with
      # the mutagen tag writer this image ships.
      # The installer always sets MUSIC_DIR; ./music is only a placeholder so
      # the database computer of a split install does not need one.
      - ${MUSIC_DIR:-./music}:/mnt/music:${TAGAVE_MUSIC_MODE:-ro}
    restart: unless-stopped
    logging: *logging
    depends_on:
      # On a split install Postgres lives on another computer, so this
      # dependency only applies when the "app" profile runs here too.
      postgres:
        condition: service_healthy
        required: false
      app:
        condition: service_healthy
        required: false

  # Opt-in: the in-app updater (Settings > Updates). It moves this install to
  # a new release when the owner asks in the app: backup, TAGAVE_VERSION in
  # .env, pull, restart, health check, and a roll back (with the database
  # restored when needed) if the new version fails.
  #
  # It mounts the Docker socket, which gives it the power of root on this
  # computer, and this install folder (compose files and .env) at the same
  # path as on the host. Nothing else. It publishes no port: only the app
  # reaches it, over the internal "updater" network, and every call is signed
  # with a key derived from APP_SECRET. Turn it off by removing "updater"
  # from COMPOSE_PROFILES in .env and running docker compose up -d
  # --remove-orphans. docs/security.md has the details.
  updater:
    profiles: ["updater"]
    image: ${TAGAVE_REGISTRY:-ghcr.io/xooxoxxo}/tagave-updater:${TAGAVE_VERSION:?TAGAVE_VERSION is missing from .env}${TAGAVE_DIGEST_UPDATER:+@${TAGAVE_DIGEST_UPDATER}}
    environment:
      APP_SECRET: ${APP_SECRET:?APP_SECRET is missing from .env}
      # The absolute path of this install folder; install-tagave.sh
      # --with-updater and enable-updater write it to .env.
      TAGAVE_INSTALL_DIR: ${TAGAVE_INSTALL_DIR:-/TAGAVE_INSTALL_DIR-is-not-set}
      TAGAVE_UPDATER_HEALTH_TIMEOUT: ${TAGAVE_UPDATER_HEALTH_TIMEOUT:-600}
      TAGAVE_UPDATER_MIN_FREE_MB: ${TAGAVE_UPDATER_MIN_FREE_MB:-3072}
      TZ: ${TZ:-UTC}
    working_dir: ${TAGAVE_INSTALL_DIR:-/TAGAVE_INSTALL_DIR-is-not-set}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The same path inside as outside, so compose resolves every relative
      # path in compose.yml exactly as it does on the host.
      - type: bind
        source: ${TAGAVE_INSTALL_DIR:-/TAGAVE_INSTALL_DIR-is-not-set}
        target: ${TAGAVE_INSTALL_DIR:-/TAGAVE_INSTALL_DIR-is-not-set}
    networks:
      - updater
    restart: unless-stopped
    logging: *logging

  # Opt-in: the player, an unmodified Navidrome (https://www.navidrome.org)
  # that streams your music to tagave and to phone apps. tagave reaches it as
  # http://player:4533 with the admin account below; phone apps log in to it
  # directly on the published port.
  #
  # It reads the music read-only, always (even with --music-writable), and
  # keeps its own database in the "player-data" volume. That is SQLite: keep
  # it on a local Docker volume, never on NFS. The file watcher is off
  # (inotify does not work over NFS); tagave asks for a scan after it writes
  # tags, and a full scan runs every 24 hours. Sharing, the Jellyfin API,
  # Deezer lookups and Navidrome's anonymous usage reports are off.
  #
  # The image is pinned per tagave release to the newest Navidrome release
  # that is at least 30 days old. 0.64.0 (2026-09-12) is that today; 0.64.1
  # (security fixes, including throttling of Subsonic login attempts) becomes
  # eligible on 2026-10-21 and 0.64.2 (fixes for "database is locked" on slow
  # storage) on 2026-10-24: bump the pin then. TAGAVE_PLAYER_IMAGE overrides
  # it (unsupported; the updater refuses to update while it is set, since it
  # replaces the pinned image). Navidrome migrates its database forward only, so
  # install-tagave.sh update and the in-app updater copy it to
  # /data/snapshots/pre-update before a new image starts.
  #
  # Turn it on in Settings > Modules (with the updater), or with
  # install-tagave.sh --with-player or enable-player; off the same way. The port is published on this computer's network
  # for phone apps; put it behind your HTTPS reverse proxy or VPN and never
  # forward it from your router (docs/security.md).
  player:
    profiles: ["player"]
    image: ${TAGAVE_PLAYER_IMAGE:-deluan/navidrome:0.64.0${TAGAVE_DIGEST_PLAYER:+@${TAGAVE_DIGEST_PLAYER}}}
    # Refuse to start without the admin password and the encryption key:
    # a Navidrome without an admin lets whoever reaches its port first
    # create one. The image itself is unchanged.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$ND_DEVAUTOCREATEADMINPASSWORD" ] || [ -z "$$ND_PASSWORDENCRYPTIONKEY" ]; then
          echo "tagave: TAGAVE_PLAYER_PASSWORD or TAGAVE_PLAYER_ENCRYPTION_KEY is missing from .env, so the player does not start. Run ./install-tagave.sh enable-player to set them." >&2
          exit 1
        fi
        exec /app/navidrome
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data/navidrome
      ND_CACHEFOLDER: /data/cache
      ND_CONFIGFILE: /data/navidrome/navidrome.toml
      # 0 turns the file watcher off
      ND_SCANNER_WATCHERWAIT: "0"
      ND_SCANNER_SCHEDULE: "@every 24h"
      ND_ENABLESHARING: "false"
      ND_ENABLEINSIGHTSCOLLECTOR: "false"
      ND_JELLYFIN_ENABLED: "false"
      # no artist and album lookups at Deezer; Last.fm only with a key of the
      # owner's in .env (empty: that agent stays off)
      ND_DEEZER_ENABLED: "false"
      ND_LASTFM_APIKEY: ${TAGAVE_LASTFM_API_KEY:-}
      ND_LASTFM_SECRET: ${TAGAVE_LASTFM_SECRET:-}
      # tagave matches tracks to its files by path
      ND_SUBSONIC_DEFAULTREPORTREALPATH: "true"
      # Creates the user "admin" with this password on the first start,
      # before Navidrome listens. Both values live only in .env.
      ND_DEVAUTOCREATEADMINPASSWORD: ${TAGAVE_PLAYER_PASSWORD:-}
      ND_PASSWORDENCRYPTIONKEY: ${TAGAVE_PLAYER_ENCRYPTION_KEY:-}
      ND_LOGLEVEL: info
      TZ: ${TZ:-UTC}
    volumes:
      - player-data:/data
      - ${MUSIC_DIR:-./music}:/music:ro
    ports:
      - "${TAGAVE_PLAYER_PORT:-4533}:4533"
    # A scan cannot starve Postgres on a small machine.
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:4533/ping"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

networks:
  # The updater's only network: the app and the updater, nothing else, and no
  # route out (the Docker daemon, not the updater, downloads images).
  updater:
    internal: true

volumes:
  pgdata:
  cache:
  backups:
  player-data:
